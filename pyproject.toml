[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kv14"
version = "14.2.0"
description = "KV-14 Agentic Swarm Code Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kv-creates", email = "kv-creates@github.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "torch>=2.4",
    "transformers>=4.41",
    "accelerate>=0.30",
    "numpy>=1.26",
    "typer>=0.12",
    "httpx>=0.27",
    "pytest>=8.2",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "mypy"]

[project.scripts]
kv14 = "cli.kv14cli:app"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select=["E","F"]
keywords=["code-intelligence","agents","swarm"]
