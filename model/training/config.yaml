model:
  name: "KV-14"
  params: "14.2B"
  hidden_size: 5120
  layers: 42
  heads: 40
  context: 131072
  vocab_size: 52000

data:
  tokens: "1.4T"
  sources:
    - TheStack-v2-dedup: 800B
    - CVEFixes: 40B
    - Defects4J+BugsInPy: 30B
    - PRReviews-4M: 300B
    - SwarmTraces: 200B
  languages: 22

training:
  gpus: 8
  hardware: "H100 80GB"
  days: 5
  batch_size: 2048
  lr: 2.0e-4
  warmup: 2000
  weight_decay: 0.1
  optimizer: "AdamW"
  precision: "bf16"
  deepspeed: "zero3"
  flash_attn: true

eval:
  benchmarks: ["HumanEvalFix", "Defects4J", "CVEFixes", "CodeReviewer"]
